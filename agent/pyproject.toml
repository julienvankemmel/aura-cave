[project]
name = "aura-agent"
version = "0.1.0"
description = "AuraCave AI - agent conversationnel (FastAPI, LangGraph, MCP)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "fastembed>=0.9.1",
    "fastmcp>=4.1.4",
    "httpx>=0.28",
    "langchain-anthropic>=1.7.7",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.18",
    "numpy>=2.5.4",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "uvicorn>=0.34",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.23.1",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aura_agent"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "SIM"]
ignore = ["E501"]  # textes français longs ; le formateur gère le code

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
