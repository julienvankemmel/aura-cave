# Configuration Trivy partagée (CLI locale, make security, CI).
format: table
exit-code: 1
severity:
  - HIGH
  - CRITICAL
scan:
  scanners:
    - vuln
    - secret
    - misconfig
  skip-dirs:
    - "**/node_modules"
    - "**/vendor"
    - "**/.venv"
    - "**/.next"
    - "**/var"
secret:
  config: trivy-secret.yaml
vulnerability:
  ignore-unfixed: true
