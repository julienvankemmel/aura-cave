# Faux positifs connus : la règle gcp-service-account se déclenche sur la documentation du SDK anthropic
# (« {customer-named principal} ») dans les paquets installés des images. Aucun secret réel.
allow-rules:
  - id: anthropic-sdk-docstrings
    description: Docstrings du SDK anthropic (site-packages)
    path: ".*/site-packages/anthropic/.*"
