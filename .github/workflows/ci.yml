name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (PHPStan + PHPUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aura
          POSTGRES_PASSWORD: change-me-dev-only
          POSTGRES_DB: postgres
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U aura" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://aura:change-me-dev-only@127.0.0.1:5433/aura_test?serverVersion=16&charset=utf8
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: sodium, pdo_pgsql
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/phpstan analyse --memory-limit=512M
      - run: vendor/bin/phpunit

  agent:
    name: Agent (Ruff + Mypy + Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: agent/uv.lock
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --strict
      - run: uv run pytest

  frontend:
    name: Frontend (TSC + ESLint + Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  security:
    name: Security (Trivy + audits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: trivy.yaml
          scanners: vuln,secret,misconfig
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer:v2
      - run: composer audit --locked
        working-directory: backend
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen && uv pip check
        working-directory: agent
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - run: pnpm audit --prod --audit-level high
        working-directory: frontend

  images:
    name: Image ${{ matrix.service }} (build + Trivy)
    runs-on: ubuntu-latest
    needs: [backend, agent, frontend, security]
    strategy:
      fail-fast: false
      matrix:
        service: [backend, agent, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          file: infra/docker/${{ matrix.service }}.Dockerfile
          load: true
          tags: aura-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: aura-${{ matrix.service }}:ci
          trivy-config: trivy.yaml
          scanners: vuln,secret
